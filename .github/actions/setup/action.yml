name: 'Setup Monorepo'
description: 'Install pnpm, Node.js, dependencies, and configure the monorepo'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '20'
  pnpm-version:
    description: 'pnpm version'
    required: false
    default: '9.15.0'
  install-deps:
    description: 'Whether to install dependencies'
    required: false
    default: 'true'
  generate-prisma:
    description: 'Whether to generate Prisma client'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Restore pnpm store cache
      id: pnpm-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/share/pnpm/store
          .pnpm-store
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Restore Turbo cache
      uses: actions/cache@v4
      with:
        path: |
          .turbo
          **/.turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-
          ${{ runner.os }}-turbo-main

    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generate Prisma client
      if: inputs.generate-prisma == 'true'
      shell: bash
      run: pnpm --filter @tienda/database db:generate
