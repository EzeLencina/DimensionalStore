name: PR Check
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'

jobs:
  validate:
    name: PR Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          generate-prisma: 'true'

      - uses: ./.github/actions/quality
        with:
          run-arch: 'true'
          run-circular: 'true'

      - uses: ./.github/actions/test
        with:
          run-unit: 'true'
          coverage: 'true'
          upload-artifacts: 'true'

      - uses: ./.github/actions/build
        with:
          upload-artifacts: 'true'

  lint-pr-title:
    name: Lint PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
            style

  label-check:
    name: Label Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require changelog label
        uses: mheap/github-action-required-labels@v5
        with:
          mode: exactly
          count: 1
          labels: |
            major
            minor
            patch
            no-release
